name: Deploy

on:
  workflow_dispatch:
    inputs:
      server_port:
        description: SSH port for the deployment server
        required: false
        default: "22"
        type: string

env:
  PHP_COMMAND: /opt/alt/php85/usr/bin/php
  COMPOSER_COMMAND: /opt/alt/php85/usr/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-plugins --no-scripts
  SSH_PORT: ${{ inputs.server_port || '22' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Backup current deployment
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd "${{ secrets.SERVER_PATH }}"
            timestamp=$(date +%Y%m%d_%H%M%S)
            backup_dir="${{ secrets.SERVER_PATH }}_backup_${timestamp}"
            mkdir "$backup_dir"
            cp -R "${{ secrets.SERVER_PATH }}" "$backup_dir"
            echo "$backup_dir" > /tmp/last_backup_path
          EOF

      - name: Deploy to Webhost
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ env.SSH_PORT }}
          SOURCE: "./"
          TARGET: ${{ secrets.SERVER_PATH }}
          ARGS: "-avz --delete"
          # Comma-separated list; ssh-deploy splits on "," and trims each option.
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes, -o BatchMode=yes"
          # Quote patterns because ssh-deploy builds a shell command.
          EXCLUDE: >-
            '.git*', '.github*', '.phan*', '.env*', '.vscode',
            'Makefile', '.dockerignore', '.styleci.yml', 'README.md',
            'vendor', 'docs', 'scripts', 'stubs', 'docker', 'Dockerfile',
            'docker-compose.yml', 'tests', 'db', 'container', 'php-artisan',
            'phpstan.neon', 'phpunit*', 'composer', 'vite*',
            'devcontainer.json', 'package.json', 'ruleset.xml', 'clover.xml'

      - name: Post-deployment tasks
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd "${{ secrets.SERVER_PATH }}"
            ${{ env.COMPOSER_COMMAND }}
            chmod -R 755 storage
            ${{ env.PHP_COMMAND }} artisan migrate --force
            ${{ env.PHP_COMMAND }} artisan view:clear
            ${{ env.PHP_COMMAND }} artisan config:cache
            ${{ env.PHP_COMMAND }} artisan route:cache
          EOF

      # - name: Rollback on failure
      #   if: failure()
      #   run: |
      #     ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
      #       backup_dir=$(cat /tmp/last_backup_path)
      #       rm -rf ${{ secrets.SERVER_PATH }}
      #       mv $backup_dir ${{ secrets.SERVER_PATH }}
      #       cd ${{ secrets.SERVER_PATH }}
      #       ${{ env.PHP_COMMAND }} artisan migrate:rollback
      #       ${{ env.PHP_COMMAND }} artisan config:clear
      #       ${{ env.PHP_COMMAND }} artisan route:clear
      #       ${{ env.PHP_COMMAND }} artisan cache:clear
      #     EOF

