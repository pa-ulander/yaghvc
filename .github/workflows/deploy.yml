      #     if [ ${{ job.status }} == 'success' ]; then
      #       echo "Deployment successful"
      #       # Add success notification here (e.g., Slack, email)
      #     else
      #       echo "Deployment failed, rolled back to previous version"
      #       # Add failure notification here
      #     fi
