name: Deploy
permissions:
  contents: read

on:
  workflow_dispatch:

env:
  PHP_COMMAND: php
  COMPOSER_COMMAND: composer update --no-dev --optimize-autoloader --no-plugins --no-scripts && composer dumpautoload
  DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL || 'https://ghvc.kabelkultur.se/up' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PATH: ${{ secrets.SERVER_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Validate SSH host key
        shell: bash
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::error::The SERVER_HOST secret is empty."
            exit 1
          fi

          if ! ssh-keygen -F "$SERVER_HOST" -f "$HOME/.ssh/known_hosts" |
            ssh-keygen -l -f /dev/stdin > /dev/null; then
            echo "::error::KNOWN_HOSTS must contain a valid, verified host key for SERVER_HOST."
            exit 1
          fi

      - name: Backup current deployment
        id: backup
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -eu
            deployment_path="${{ secrets.SERVER_PATH }}"
            deployment_path="${deployment_path%/}"
            case "$deployment_path" in
              /*) ;;
              *) echo "SERVER_PATH must be an absolute path." >&2; exit 1 ;;
            esac
            if [ ! -d "$deployment_path" ]; then
              echo "Deployment directory does not exist: $deployment_path" >&2
              exit 1
            fi
            if ! command -v rsync >/dev/null 2>&1; then
              echo "rsync is required on the deployment server for backup and rollback." >&2
              exit 1
            fi
            backup_dir="${deployment_path}_backup_${{ github.run_id }}_${{ github.run_attempt }}"
            if [ -e "$backup_dir" ]; then
              echo "Backup path already exists: $backup_dir" >&2
              exit 1
            fi
            mkdir "$backup_dir"
            trap 'rm -rf -- "$backup_dir"' EXIT
            rsync -a --delete --exclude='/storage' "$deployment_path/" "$backup_dir/files/"
            touch "$backup_dir/complete"
            trap - EXIT
          EOF

      - name: Deploy to Webhost
        # Preserve server-side uploads, sessions, caches, and logs during --delete.
        run: |
          rsync -avz --delete -e 'ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            --exclude='/storage' \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.phan*' \
            --exclude='.env*' \
            --exclude='.vscode' \
            --exclude='Makefile' \
            --exclude='.dockerignore' \
            --exclude='.styleci.yml' \
            --exclude='README.md' \
            --exclude='vendor' \
            --exclude='docs' \
            --exclude='scripts' \
            --exclude='stubs' \
            --exclude='docker' \
            --exclude='Dockerfile' \
            --exclude='docker-compose.yml' \
            --exclude='tests' \
            --exclude='db' \
            --exclude='container' \
            --exclude='php-artisan' \
            --exclude='phpstan.neon' \
            --exclude='phpunit*' \
            --exclude='composer' \
            --exclude='vite*' \
            --exclude='devcontainer.json' \
            --exclude='package.json' \
            --exclude='ruleset.xml' \
            --exclude='clover.xml' \
            ./ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH"

      - name: Post-deployment tasks
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -e
            cd "${{ secrets.SERVER_PATH }}"
            # Composer autoload hooks boot Laravel and need these directories first.
            mkdir -p storage/app/public \
              storage/framework/cache/data \
              storage/framework/sessions \
              storage/framework/views \
              storage/logs \
              bootstrap/cache
            chmod -R 755 storage
            ${{ env.COMPOSER_COMMAND }} || exit $?
            ${{ env.PHP_COMMAND }} artisan migrate --force
            ${{ env.PHP_COMMAND }} artisan view:clear
            ${{ env.PHP_COMMAND }} artisan config:cache
            ${{ env.PHP_COMMAND }} artisan route:cache
          EOF

      - name: Verify production health
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 5 --max-time 15 --retry 3 --retry-delay 2 \
            "$DEPLOY_HEALTHCHECK_URL" > /dev/null

      - name: Rollback on failure
        if: failure() && steps.backup.outcome == 'success'
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -eu
            deployment_path="${{ secrets.SERVER_PATH }}"
            deployment_path="${deployment_path%/}"
            backup_dir="${deployment_path}_backup_${{ github.run_id }}_${{ github.run_attempt }}"
            if [ ! -f "$backup_dir/complete" ] || [ ! -d "$backup_dir/files" ]; then
              echo "A complete backup is unavailable; refusing to replace the deployment." >&2
              exit 1
            fi
            rsync -a --delete --exclude='/storage' "$backup_dir/files/" "$deployment_path/"
          EOF

      # - name: Cleanup old backups
      #   if: always()
      #   run: |
      #     ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
      #       find ${{ secrets.SERVER_PATH }}_backup_* -maxdepth 0 -type d -mtime +7 -exec rm -rf {} +
      #     EOF

