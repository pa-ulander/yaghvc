name: Deploy

on:
  workflow_dispatch:

env:
  PHP_COMMAND: php
  COMPOSER_COMMAND: composer install --no-dev --optimize-autoloader --no-plugins --no-scripts && composer dumpautoload

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PATH: ${{ secrets.SERVER_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Validate SSH host key
        shell: bash
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::error::The SERVER_HOST secret is empty."
            exit 1
          fi

          if ! ssh-keygen -F "$SERVER_HOST" -f "$HOME/.ssh/known_hosts" |
            ssh-keygen -l -f /dev/stdin > /dev/null; then
            echo "::error::KNOWN_HOSTS must contain a valid, verified host key for SERVER_HOST. See DEPLOYMENT.md."
            exit 1
          fi

      - name: Backup current deployment
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -e
            cd "${{ secrets.SERVER_PATH }}"
            deployment_path="$PWD"
            timestamp=$(date +%Y%m%d_%H%M%S)
            backup_dir="${deployment_path}_backup_${timestamp}"
            mkdir "$backup_dir"
            cp -R "$deployment_path" "$backup_dir"
            echo "$backup_dir" > /tmp/last_backup_path
          EOF

      - name: Deploy to Webhost
        # Preserve server-side uploads, sessions, caches, and logs during --delete.
        run: |
          rsync -avz --delete -e 'ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            --exclude='/storage' \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.phan*' \
            --exclude='.env*' \
            --exclude='.vscode' \
            --exclude='Makefile' \
            --exclude='.dockerignore' \
            --exclude='.styleci.yml' \
            --exclude='README.md' \
            --exclude='vendor' \
            --exclude='docs' \
            --exclude='scripts' \
            --exclude='stubs' \
            --exclude='docker' \
            --exclude='Dockerfile' \
            --exclude='docker-compose.yml' \
            --exclude='tests' \
            --exclude='db' \
            --exclude='container' \
            --exclude='php-artisan' \
            --exclude='phpstan.neon' \
            --exclude='phpunit*' \
            --exclude='composer' \
            --exclude='vite*' \
            --exclude='devcontainer.json' \
            --exclude='package.json' \
            --exclude='ruleset.xml' \
            --exclude='clover.xml' \
            ./ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH"

      - name: Post-deployment tasks
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -e
            cd "${{ secrets.SERVER_PATH }}"
            # Composer autoload hooks boot Laravel and need these directories first.
            mkdir -p storage/app/public \
              storage/framework/cache/data \
              storage/framework/sessions \
              storage/framework/views \
              storage/logs \
              bootstrap/cache
            chmod -R 755 storage
            ${{ env.COMPOSER_COMMAND }} || exit $?
            ${{ env.PHP_COMMAND }} artisan migrate --force
            ${{ env.PHP_COMMAND }} artisan view:clear
            ${{ env.PHP_COMMAND }} artisan config:cache
            ${{ env.PHP_COMMAND }} artisan route:cache
          EOF

      # - name: Rollback on failure
      #   if: failure()
      #   run: |
      #     ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
      #       backup_dir=$(cat /tmp/last_backup_path)
      #       rm -rf ${{ secrets.SERVER_PATH }}
      #       mv $backup_dir ${{ secrets.SERVER_PATH }}
      #       cd ${{ secrets.SERVER_PATH }}
      #       ${{ env.PHP_COMMAND }} artisan migrate:rollback
      #       ${{ env.PHP_COMMAND }} artisan config:clear
      #       ${{ env.PHP_COMMAND }} artisan route:clear
      #       ${{ env.PHP_COMMAND }} artisan cache:clear
      #     EOF

      # - name: Cleanup old backups
      #   if: always()
      #   run: |
      #     ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
      #       find ${{ secrets.SERVER_PATH }}_backup_* -maxdepth 0 -type d -mtime +7 -exec rm -rf {} +
      #     EOF

